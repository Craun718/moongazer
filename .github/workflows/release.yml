name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Use npm with trusted publishing support
        run: npm install -g npm@^11.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck & Test
        run: pnpm -r typecheck && pnpm -r test

      - name: Bump version
        id: bump
        run: |
          npm version ${{ inputs.bump }} --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Build
        run: pnpm -r build

      - name: Commit, tag, and push
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          TAG="@pulonia/moongazer@${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): v${VERSION}"
          git tag "$TAG"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          git push origin "$TAG"

      - name: Publish to npm with trusted publishing
        run: |
          ROOT_VERSION=$(node -p "require('./package.json').version")
          MCP_VERSION=$(node -p "require('./packages/mcp/package.json').version")
          pnpm -r pack --pack-destination release-packages
          npm publish "release-packages/pulonia-moongazer-${ROOT_VERSION}.tgz" --access public
          npm publish "release-packages/pulonia-moongazer-mcp-${MCP_VERSION}.tgz" --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "@pulonia/moongazer@${{ steps.bump.outputs.version }}"
          generate_release_notes: true
          make_latest: true
