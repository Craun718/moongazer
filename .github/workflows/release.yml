name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      publish_only:
        description: Publish the selected ref without bumping or creating a tag
        required: false
        default: false
        type: boolean
      publish_ref:
        description: Git ref to publish when publish_only is enabled
        required: false
        default: ""
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.publish_ref || github.sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Use npm with trusted publishing support
        run: npm install -g npm@^11.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck & Test
        run: pnpm --include-workspace-root --recursive typecheck && pnpm --include-workspace-root --recursive test

      - name: Bump version
        id: bump
        if: ${{ inputs.publish_only != true }}
        run: |
          VERSION=$(npm version ${{ inputs.bump }} --no-git-tag-version | sed 's/^v//')
          for package_dir in packages/*; do
            [ -f "$package_dir/package.json" ] || continue
            npm version "$VERSION" --no-git-tag-version --prefix "$package_dir"
          done

      - name: Verify synchronized versions
        run: |
          ROOT_VERSION=$(node -p "require('./package.json').version")
          for manifest in packages/*/package.json; do
            PACKAGE_VERSION=$(node -p "require('./$manifest').version")
            if [ "$PACKAGE_VERSION" != "$ROOT_VERSION" ]; then
              echo "Version mismatch: $manifest has $PACKAGE_VERSION, root has $ROOT_VERSION" >&2
              exit 1
            fi
          done

      - name: Build
        run: pnpm --include-workspace-root --recursive build

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Commit, tag, and push
        if: ${{ inputs.publish_only != true }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="@pulonia/moongazer@${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json packages/*/package.json
          git commit -m "chore(release): v${VERSION}"
          git tag "$TAG"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          git push origin "$TAG"

      - name: Publish to npm with trusted publishing
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npm-publish.rc
          NODE_AUTH_TOKEN: ""
        run: |
          printf 'registry=https://registry.npmjs.org/\n' > "$NPM_CONFIG_USERCONFIG"
          mkdir -p release-packages

          for package_dir in . packages/*; do
            [ -f "$package_dir/package.json" ] || continue
            NAME=$(node -p "require('./$package_dir/package.json').name")
            VERSION=$(node -p "require('./$package_dir/package.json').version")
            TARBALL=$(pnpm --dir "$package_dir" pack --pack-destination release-packages | tail -n 1)
            if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
              echo "${NAME}@${VERSION} already exists; skipping"
              continue
            fi
            npm publish "$TARBALL" --access public
          done

      - name: Create GitHub Release
        if: ${{ inputs.publish_only != true }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "@pulonia/moongazer@${{ steps.version.outputs.version }}"
          generate_release_notes: true
          make_latest: true
