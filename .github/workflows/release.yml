name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      publish_only:
        description: Publish the selected ref without bumping or creating a tag
        required: false
        default: false
        type: boolean
      publish_ref:
        description: Git ref to publish when publish_only is enabled
        required: false
        default: ""
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.publish_ref || github.sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Use npm with trusted publishing support
        run: npm install -g npm@^11.15.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck & Test
        run: pnpm --include-workspace-root --recursive typecheck && pnpm --include-workspace-root --recursive test

      - name: Bump version
        id: bump
        if: ${{ inputs.publish_only != true }}
        run: |
          npm version ${{ inputs.bump }} --no-git-tag-version

      - name: Build
        run: pnpm --include-workspace-root --recursive build

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Commit, tag, and push
        if: ${{ inputs.publish_only != true }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="@pulonia/moongazer@${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): v${VERSION}"
          git tag "$TAG"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          git push origin "$TAG"

      - name: Publish to npm with trusted publishing
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npm-publish.rc
          NODE_AUTH_TOKEN: ""
        run: |
          printf 'registry=https://registry.npmjs.org/\n' > "$NPM_CONFIG_USERCONFIG"
          ROOT_VERSION=$(node -p "require('./package.json').version")
          MCP_VERSION=$(node -p "require('./packages/mcp/package.json').version")
          pnpm --include-workspace-root --recursive pack --pack-destination release-packages

          publish_if_absent() {
            local name="$1"
            local version="$2"
            local tarball="$3"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} already exists; skipping"
              return
            fi
            npm publish "./${tarball}" --access public --loglevel verbose
          }

          publish_if_absent "@pulonia/moongazer" "$ROOT_VERSION" \
            "release-packages/pulonia-moongazer-${ROOT_VERSION}.tgz"
          publish_if_absent "@pulonia/moongazer-mcp" "$MCP_VERSION" \
            "release-packages/pulonia-moongazer-mcp-${MCP_VERSION}.tgz"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "@pulonia/moongazer@${{ steps.version.outputs.version }}"
          generate_release_notes: true
          make_latest: true
